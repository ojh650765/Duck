<!DOCTYPE html>
<!--
  DUCK MOW's page.

  Forked from Unity's default WebGL template for three reasons, all of them about
  what the player sees before and around the game rather than about the game:

    1. Chrome offers to translate the page. The default template ships no
       translation hints, so a browser set to any language other than English
       puts a dialog over the top of the canvas the moment the page loads. It is
       the first thing a Korean-locale player sees, and it is covering the game.

    2. Unity's default banner drops a coloured bar over the canvas for any
       runtime warning. Those messages are for a developer, not a player, and a
       yellow bar across a game is worse than the warning it is reporting.

    3. A failure to start was an alert() box, which tells a player nothing they
       can act on.
-->
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!-- Stop the browser offering to translate a page that is almost entirely a
         canvas. Chrome honours notranslate; the class covers older paths. -->
    <meta name="google" content="notranslate">

    <title>Duck Mow</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body class="notranslate">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Duck Mow</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Warnings go to the console, not over the game.
      //
      // Unity's default implementation appends a yellow or red bar to the page
      // for any message the runtime decides to surface. Most of those are
      // developer information — a shader fallback, a deprecated call — and a
      // player can do nothing with them except read a bar sitting on top of
      // their lawn. Errors still reach the page, because those are the ones
      // where the game has genuinely stopped and saying nothing would be worse.
      function unityShowBanner(msg, type) {
        if (type !== 'error') {
          console.warn('[Duck Mow] ' + msg);
          return;
        }
        var warningBanner = document.querySelector("#unity-warning");
        var div = document.createElement('div');
        div.innerHTML = msg;
        div.style = 'background: #b03a34; color: #f6ebd2; padding: 10px;';
        warningBanner.appendChild(div);
        warningBanner.style.display = 'block';
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Duck Mow",
        productName: "Duck Mow",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile: fill the client area with the canvas.
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          // In the player's language of "something went wrong", not a raw alert.
          unityShowBanner("Duck Mow could not start in this browser. " + message, 'error');
          document.querySelector("#unity-loading-bar").style.display = "none";
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
